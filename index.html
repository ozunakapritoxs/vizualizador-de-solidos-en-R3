<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>∭ Integrales Triples</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(','\\)']], displayMath: [['\\[','\\]']] },
  startup: { typeset: false }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-chtml.min.js" async></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080b12;
  --panel: #0e1220;
  --border: #1c2438;
  --border2: #232d45;
  --accent: #5d84f5;
  --accent-glow: rgba(93,132,245,0.15);
  --accent2: #f5a05d;
  --accent3: #5df5b0;
  --text: #dce4f5;
  --text2: #8a97b8;
  --muted: #3d4a68;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; display:flex; flex-direction:column; height:100vh; }

header { display:flex; align-items:center; gap:16px; padding:0 24px; height:52px; background:var(--panel); border-bottom:1px solid var(--border); flex-shrink:0; }
.logo { font-family:'Crimson Pro',serif; font-size:1.4rem; color:var(--accent); letter-spacing:-0.01em; }
.logo em { color:var(--text); font-style:normal; }
.subtitle { font-size:0.7rem; font-family:'JetBrains Mono',monospace; color:var(--muted); letter-spacing:0.05em; }
.badge { margin-left:auto; font-size:0.65rem; font-family:'JetBrains Mono',monospace; color:var(--accent); background:var(--accent-glow); border:1px solid rgba(93,132,245,0.3); padding:3px 10px; border-radius:100px; }

.body-wrap { display:flex; flex:1; overflow:hidden; min-height:0; }

.sidebar { width:230px; flex-shrink:0; display:flex; flex-direction:column; background:var(--panel); border-right:1px solid var(--border); overflow:hidden; }
.sidebar-head { padding:12px 14px 10px; font-size:0.6rem; font-family:'JetBrains Mono',monospace; letter-spacing:0.12em; color:var(--muted); text-transform:uppercase; border-bottom:1px solid var(--border); flex-shrink:0; }
.solid-list { overflow-y:auto; flex:1; padding:6px; }
.solid-list::-webkit-scrollbar { width:3px; }
.solid-list::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }

.s-btn { width:100%; background:transparent; border:1px solid transparent; border-radius:7px; padding:9px 11px; margin-bottom:3px; cursor:pointer; text-align:left; transition:all 0.15s; color:var(--text); }
.s-btn:hover { background:#141a2e; border-color:var(--border2); }
.s-btn.active { background:linear-gradient(135deg,#111e40,#0e1830); border-color:var(--accent); box-shadow:0 0 12px var(--accent-glow); }
.s-btn .n { font-size:0.58rem; font-family:'JetBrains Mono',monospace; color:var(--accent); letter-spacing:0.05em; margin-bottom:3px; }
.s-btn .t { font-size:0.78rem; font-weight:500; line-height:1.3; }
.s-btn .c { font-size:0.6rem; font-family:'JetBrains Mono',monospace; color:var(--muted); margin-top:3px; }
.s-btn.active .n { color:#80a8ff; }

.canvas-area { flex:1; position:relative; overflow:hidden; background:radial-gradient(ellipse at 40% 40%,#0d1422 0%,var(--bg) 70%); }
#cv { display:block; width:100%; height:100%; }
.hint { position:absolute; top:12px; right:12px; font-size:0.62rem; font-family:'JetBrains Mono',monospace; color:var(--muted); background:rgba(8,11,18,0.8); border:1px solid var(--border); padding:6px 11px; border-radius:7px; line-height:1.8; pointer-events:none; backdrop-filter:blur(4px); }
.axis-key { position:absolute; bottom:12px; right:12px; font-family:'JetBrains Mono',monospace; font-size:0.62rem; display:flex; flex-direction:column; gap:4px; pointer-events:none; background:rgba(8,11,18,0.75); border:1px solid var(--border); padding:7px 11px; border-radius:7px; backdrop-filter:blur(4px); }
.axis-key span { display:flex; align-items:center; gap:7px; color:var(--text2); }
.dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
.solid-name-overlay { position:absolute; top:12px; left:12px; font-family:'Crimson Pro',serif; font-size:1.1rem; font-style:italic; color:rgba(220,228,245,0.5); pointer-events:none; }

.info { background:var(--panel); border-top:1px solid var(--border); flex-shrink:0; display:flex; height:170px; overflow:hidden; }
.info-block { padding:14px 20px; border-right:1px solid var(--border); }
.info-label { font-size:0.58rem; font-family:'JetBrains Mono',monospace; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:9px; }
.info-label.l1 { color:var(--accent); }
.info-label.l2 { color:var(--accent2); }
.integral-wrap { min-width:320px; max-width:420px; }
.integral-box { background:#070a10; border:1px solid var(--border2); border-radius:8px; padding:12px 16px; min-height:80px; display:flex; align-items:center; justify-content:center; font-size:1rem; overflow-x:auto; color:var(--text); }
.desc-wrap { flex:1; overflow-y:auto; padding:14px 20px; }
.desc-wrap::-webkit-scrollbar { width:3px; }
.desc-title { font-family:'Crimson Pro',serif; font-size:1.05rem; font-style:italic; margin-bottom:8px; }
.tags { display:flex; flex-wrap:wrap; gap:5px; }
.tag-item { font-size:0.65rem; font-family:'JetBrains Mono',monospace; background:#0d1422; border:1px solid var(--border2); padding:3px 9px; border-radius:20px; color:var(--accent3); }
.empty-msg { font-style:italic; color:var(--muted); font-size:0.85rem; }
</style>
</head>
<body>
<header>
  <div class="logo">∭ <em>Integrales Triples</em></div>
  <div class="subtitle">Visualizador 3D interactivo</div>
  <div class="badge">Cálculo III</div>
</header>
<div class="body-wrap">
  <aside class="sidebar">
    <div class="sidebar-head">Sólidos</div>
    <div class="solid-list" id="solidList"></div>
  </aside>
  <div class="canvas-area">
    <canvas id="cv"></canvas>
    <div class="hint">🖱 Arrastrar → rotar<br>⚙ Scroll → zoom<br>🖱 Derecho → pan</div>
    <div class="axis-key">
      <span><span class="dot" style="background:#e05555"></span> eje x</span>
      <span><span class="dot" style="background:#5577e0"></span> eje y</span>
      <span><span class="dot" style="background:#55c055"></span> eje z</span>
    </div>
    <div class="solid-name-overlay" id="overlayName"></div>
  </div>
</div>
<div class="info">
  <div class="info-block integral-wrap">
    <div class="info-label l1">Integral triple</div>
    <div class="integral-box" id="integralBox"><span class="empty-msg">← Selecciona un sólido</span></div>
  </div>
  <div class="desc-wrap" id="descWrap">
    <div class="info-label l2">Descripción</div>
    <div class="empty-msg">Selecciona un sólido de la lista.</div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// THREE.JS SETUP
// ══════════════════════════════════════════════════════════════════════════════
const canvas = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.01, 300);

function resize() {
  const p = canvas.parentElement;
  renderer.setSize(p.clientWidth, p.clientHeight);
  camera.aspect = p.clientWidth / p.clientHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dL1 = new THREE.DirectionalLight(0xccd8ff, 1.1);
dL1.position.set(6, 9, 5); scene.add(dL1);
const dL2 = new THREE.DirectionalLight(0xffa080, 0.4);
dL2.position.set(-5, -3, -4); scene.add(dL2);
const dL3 = new THREE.DirectionalLight(0x80ffc0, 0.2);
dL3.position.set(0, -8, 2); scene.add(dL3);

// ══════════════════════════════════════════════════════════════════════════════
// COORDINATE SYSTEM
// Three.js: Y is up in the scene, but mathematically z is up.
// Convention here: scene.Y = math.z, scene.X = math.x, scene.Z = math.y
// So math point (x, y, z) → scene (x, z_math, y_math)
// Helper:
function V3m(x, y, z) { return new THREE.Vector3(x, z, y); } // math coords → scene
// ══════════════════════════════════════════════════════════════════════════════

// AXES — now correctly labeled: x=red, y=blue (scene Z), z=green (scene Y)
const AXLEN = 3.5;
function makeLine(p1, p2, color) {
  const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...p1), new THREE.Vector3(...p2)]);
  return new THREE.Line(g, new THREE.LineBasicMaterial({ color }));
}
function makeArrow(pos, dir, color) {
  const g = new THREE.ConeGeometry(0.06, 0.22, 8);
  const mat = new THREE.MeshBasicMaterial({ color });
  const m = new THREE.Mesh(g, mat);
  m.position.set(...pos);
  const ax = new THREE.Vector3(0,1,0).cross(new THREE.Vector3(...dir));
  const angle = Math.acos(Math.min(1, new THREE.Vector3(0,1,0).dot(new THREE.Vector3(...dir))));
  if (ax.length() > 0.001) m.quaternion.setFromAxisAngle(ax.normalize(), angle);
  return m;
}
function makeSprite(text, pos, color) {
  const c = document.createElement('canvas'); c.width=64; c.height=64;
  const ctx = c.getContext('2d');
  ctx.font='bold 40px serif'; ctx.fillStyle=color; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text, 32, 32);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
  sp.scale.set(0.4, 0.4, 1); sp.position.set(...pos); return sp;
}

const axGroup = new THREE.Group();
// x axis: scene X (red)
axGroup.add(makeLine([-0.2,0,0],[AXLEN,0,0], 0xe05555));
axGroup.add(makeArrow([AXLEN,0,0],[1,0,0], 0xe05555));
axGroup.add(makeSprite('x',[AXLEN+0.35,0,0],'#e05555'));
// z axis: scene Y = math z (green)
axGroup.add(makeLine([0,-0.2,0],[0,AXLEN,0], 0x55c055));
axGroup.add(makeArrow([0,AXLEN,0],[0,1,0], 0x55c055));
axGroup.add(makeSprite('z',[0,AXLEN+0.35,0],'#55c055'));
// y axis: scene Z = math y (blue)
axGroup.add(makeLine([0,0,-0.2],[0,0,AXLEN], 0x5577e0));
axGroup.add(makeArrow([0,0,AXLEN],[0,0,1], 0x5577e0));
axGroup.add(makeSprite('y',[0,0,AXLEN+0.35],'#5577e0'));
scene.add(axGroup);

// ══════════════════════════════════════════════════════════════════════════════
// GRID — only XY plane (math), which is scene XZ plane (y=0 in scene)
// ══════════════════════════════════════════════════════════════════════════════
const gridXY = new THREE.GridHelper(8, 16, 0x4a5470, 0x2e3850);
gridXY.material.opacity = 0.55;
gridXY.material.transparent = true;
// GridHelper is in XZ by default (scene coords), that corresponds to the math XY plane → perfect
scene.add(gridXY);

// ══════════════════════════════════════════════════════════════════════════════
// ORBIT CAMERA
// ══════════════════════════════════════════════════════════════════════════════
let theta=0.55, phi=0.68, radius=11, panX=0, panY=1.2;
let isDrag=false, isRMB=false, lx=0, ly=0;

function camUpdate() {
  camera.position.set(
    panX + radius*Math.sin(phi)*Math.sin(theta),
    panY + radius*Math.cos(phi),
    radius*Math.sin(phi)*Math.cos(theta)
  );
  camera.lookAt(panX, panY, 0);
}
camUpdate();

canvas.addEventListener('mousedown', e=>{ isDrag=true; isRMB=e.button===2; lx=e.clientX; ly=e.clientY; e.preventDefault(); });
canvas.addEventListener('contextmenu', e=>e.preventDefault());
window.addEventListener('mouseup', ()=>isDrag=false);
window.addEventListener('mousemove', e=>{
  if(!isDrag) return;
  const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
  if(isRMB){ panX-=dx*0.009; panY+=dy*0.009; }
  else{ theta-=dx*0.007; phi=Math.max(0.05,Math.min(Math.PI-0.05,phi+dy*0.007)); }
  camUpdate();
});
canvas.addEventListener('wheel', e=>{ radius=Math.max(2,Math.min(35,radius+e.deltaY*0.016)); camUpdate(); },{passive:true});
let pinchStart=null;
canvas.addEventListener('touchstart', e=>{ if(e.touches.length===1){ isDrag=true; isRMB=false; lx=e.touches[0].clientX; ly=e.touches[0].clientY; } else if(e.touches.length===2) pinchStart=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); },{passive:true});
canvas.addEventListener('touchend', ()=>{ isDrag=false; pinchStart=null; });
canvas.addEventListener('touchmove', e=>{
  if(e.touches.length===1&&isDrag){ const dx=e.touches[0].clientX-lx,dy=e.touches[0].clientY-ly; lx=e.touches[0].clientX; ly=e.touches[0].clientY; theta-=dx*0.007; phi=Math.max(0.05,Math.min(Math.PI-0.05,phi+dy*0.007)); camUpdate(); }
  else if(e.touches.length===2&&pinchStart!==null){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); radius=Math.max(2,Math.min(35,radius-(d-pinchStart)*0.04)); pinchStart=d; camUpdate(); }
},{passive:true});

// ══════════════════════════════════════════════════════════════════════════════
// GEOMETRY UTILS
// ══════════════════════════════════════════════════════════════════════════════
// All builders use math coords (x,y,z) and call V3m to convert to scene
function paramGeo(fn, uN, vN) {
  const pos=[], idx=[];
  for(let i=0;i<=uN;i++) for(let j=0;j<=vN;j++){ const p=fn(i/uN,j/vN); pos.push(p.x,p.y,p.z); }
  for(let i=0;i<uN;i++) for(let j=0;j<vN;j++){ const a=i*(vN+1)+j,b=a+1,c=a+vN+1,d=c+1; idx.push(a,c,b,b,c,d); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
function solidMat(color, opacity=0.7) {
  return new THREE.MeshPhongMaterial({ color, transparent:true, opacity, side:THREE.DoubleSide, shininess:80, specular:0x2244aa, depthWrite:opacity>0.5 });
}
function addSurf(grp, geo, color, opacity=0.72) {
  grp.add(new THREE.Mesh(geo, solidMat(color, opacity)));
}

let solidGrp = new THREE.Group();
scene.add(solidGrp);
function clearSolid(){ scene.remove(solidGrp); solidGrp=new THREE.Group(); scene.add(solidGrp); }

// ══════════════════════════════════════════════════════════════════════════════
// SOLID BUILDERS — all in math coords: (x, y, z) where z is "up"
// V3m(x, y, z) maps to scene (x, z, y)
// ══════════════════════════════════════════════════════════════════════════════

// #1: Exterior cono z²=x²+y², interior cilindro x²+y²=1, z≥0
// Cilíndricas: θ∈[0,2π], r∈[0,1], z∈[0,r]
function buildSolid1(grp) {
  // Cone top surface z=r (top boundary)
  const coneTop = paramGeo((u,v)=>{
    const th=u*Math.PI*2, r=v;
    return V3m(r*Math.cos(th), r*Math.sin(th), r);
  },72,40);
  addSurf(grp, coneTop, 0xf5a05d, 0.7);
  // Bottom disk z=0
  const bot = paramGeo((u,v)=>V3m(v*Math.cos(u*Math.PI*2), v*Math.sin(u*Math.PI*2), 0),72,30);
  addSurf(grp, bot, 0x6b95ff, 0.4);
  // Cylinder side wall r=1
  const cyl = paramGeo((u,v)=>V3m(Math.cos(u*Math.PI*2), Math.sin(u*Math.PI*2), v),72,1);
  addSurf(grp, cyl, 0x6b95ff, 0.2);
  // Interior fill rings
  for(let ri=0.2;ri<=0.9;ri+=0.2){
    const ring=paramGeo((u,v)=>V3m(ri*Math.cos(u*Math.PI*2), ri*Math.sin(u*Math.PI*2), v*ri),72,1);
    addSurf(grp, ring, 0x8aabff, 0.1);
  }
}

// #2A: Fuera del cono, entre esferas ρ=1 y ρ=3
// Esféricas: φ∈[π/4, 3π/4], ρ∈[1,3]
function buildSolid2A(grp) {
  const S=0.6;
  // Only 2 spherical shells (not 3!)
  // Outer sphere ρ=3, restricted to π/4≤φ≤3π/4
  const outerSph = paramGeo((u,v)=>{
    const th=u*Math.PI*2, ph=Math.PI/4+v*(Math.PI/2), rho=3*S;
    return V3m(rho*Math.sin(ph)*Math.cos(th), rho*Math.sin(ph)*Math.sin(th), rho*Math.cos(ph));
  },80,36);
  addSurf(grp, outerSph, 0x5df5b0, 0.28);
  // Inner sphere ρ=1, restricted to π/4≤φ≤3π/4
  const innerSph = paramGeo((u,v)=>{
    const th=u*Math.PI*2, ph=Math.PI/4+v*(Math.PI/2), rho=1*S;
    return V3m(rho*Math.sin(ph)*Math.cos(th), rho*Math.sin(ph)*Math.sin(th), rho*Math.cos(ph));
  },80,36);
  addSurf(grp, innerSph, 0x5df5b0, 0.55);
  // Annular cone caps at φ=π/4 and φ=3π/4
  for(const ph of [Math.PI/4, 3*Math.PI/4]){
    const cap = paramGeo((u,v)=>{
      const th=u*Math.PI*2, rho=(1+v*2)*S;
      return V3m(rho*Math.sin(ph)*Math.cos(th), rho*Math.sin(ph)*Math.sin(th), rho*Math.cos(ph));
    },80,20);
    addSurf(grp, cap, 0xf5a05d, 0.5);
  }
  // Mid-volume surface for depth
  const mid = paramGeo((u,v)=>{
    const th=u*Math.PI*2, ph=Math.PI/4+v*(Math.PI/2), rho=2*S;
    return V3m(rho*Math.sin(ph)*Math.cos(th), rho*Math.sin(ph)*Math.sin(th), rho*Math.cos(ph));
  },80,36);
  addSurf(grp, mid, 0x5df5b0, 0.13);
}

// #2B: Dentro del cono, entre esferas (dos napas)
function buildSolid2B(grp) {
  const S=0.6;
  const caps=[[0,Math.PI/4],[3*Math.PI/4,Math.PI]];
  caps.forEach(([ph0,ph1],ci)=>{
    const outerSph=paramGeo((u,v)=>{
      const th=u*Math.PI*2, ph=ph0+v*(ph1-ph0), rho=3*S;
      return V3m(rho*Math.sin(ph)*Math.cos(th), rho*Math.sin(ph)*Math.sin(th), rho*Math.cos(ph));
    },80,20);
    addSurf(grp, outerSph, 0xf5a05d, 0.32);
    const innerSph=paramGeo((u,v)=>{
      const th=u*Math.PI*2, ph=ph0+v*(ph1-ph0), rho=1*S;
      return V3m(rho*Math.sin(ph)*Math.cos(th), rho*Math.sin(ph)*Math.sin(th), rho*Math.cos(ph));
    },80,20);
    addSurf(grp, innerSph, 0xf5a05d, 0.6);
    const ph_edge=ci===0?Math.PI/4:3*Math.PI/4;
    const disc=paramGeo((u,v)=>{
      const th=u*Math.PI*2, rho=(1+v*2)*S;
      return V3m(rho*Math.sin(ph_edge)*Math.cos(th), rho*Math.sin(ph_edge)*Math.sin(th), rho*Math.cos(ph_edge));
    },80,20);
    addSurf(grp, disc, 0x5df5b0, 0.4);
    const mid=paramGeo((u,v)=>{
      const th=u*Math.PI*2, ph=ph0+v*(ph1-ph0), rho=2*S;
      return V3m(rho*Math.sin(ph)*Math.cos(th), rho*Math.sin(ph)*Math.sin(th), rho*Math.cos(ph));
    },80,20);
    addSurf(grp, mid, 0xf5a05d, 0.13);
  });
}

// #3: Primer cuadrante, sobre z=2(x²+y²), bajo z=8, cilindro r=2
function buildSolid3(grp) {
  const S=0.38;
  const parb=paramGeo((u,v)=>{
    const th=u*Math.PI/2, r=v*2;
    return V3m(r*Math.cos(th)*S, r*Math.sin(th)*S, 2*r*r*S);
  },60,40);
  addSurf(grp, parb, 0xf5a05d, 0.7);
  const top=paramGeo((u,v)=>{
    const th=u*Math.PI/2, r=v*2;
    return V3m(r*Math.cos(th)*S, r*Math.sin(th)*S, 8*S);
  },60,40);
  addSurf(grp, top, 0x6b95ff, 0.4);
  const cyl=paramGeo((u,v)=>{
    const th=u*Math.PI/2, r=2, zbot=2*r*r*S;
    return V3m(r*Math.cos(th)*S, r*Math.sin(th)*S, (zbot+(8*S-zbot)*v));
  },60,30);
  addSurf(grp, cyl, 0x5df5b0, 0.3);
  for(const axis of [0,1]){
    const wall=paramGeo((u,v)=>{
      const r=u*2, th=axis===0?0:Math.PI/2, zbot=2*r*r*S;
      return V3m(r*Math.cos(th)*S, r*Math.sin(th)*S, zbot+(8*S-zbot)*v);
    },40,30);
    addSurf(grp, wall, 0x9ab5ff, 0.3);
  }
}

// #4: Primer octante, planos oblicuos
function buildSolid4(grp) {
  const S=0.45;
  // Outer tilted plane 2x + 4/3 y + z = 8
  const planeOuter=paramGeo((u,v)=>{
    const x=u*4*S, y=v*6*S;
    const z=(8-2*(x/S)-(4/3)*(y/S))*S;
    return V3m(x, y, Math.max(0,z));
  },40,40);
  addSurf(grp, planeOuter, 0xf5a05d, 0.5);
  // Inner vertical plane 2x + 4/3 y = 4
  const planeInner=paramGeo((u,v)=>{
    const t=u, x=2*t*S, y=3*(1-t)*S;
    return V3m(x, y, v*8*S);
  },20,20);
  addSurf(grp, planeInner, 0x6b95ff, 0.4);
  for(const zv of [4,8]){
    const hp=paramGeo((u,v)=>V3m(u*3*S, v*4*S, zv*S),20,20);
    addSurf(grp, hp, 0x5df5b0, 0.25);
  }
  addSurf(grp, paramGeo((u,v)=>V3m(0, u*6*S, v*8*S),20,20), 0x9ab5ff, 0.2);
  addSurf(grp, paramGeo((u,v)=>V3m(u*4*S, 0, v*8*S),20,20), 0x9ab5ff, 0.2);
}

// #5: Cilindro desplazado r=2cosθ, esfera ρ=2, z≥0
function buildSolid5(grp) {
  const S=0.9;
  const sphereTop=paramGeo((u,v)=>{
    const th=(u-0.5)*Math.PI;
    const rMax=2*Math.cos(th), r=v*rMax;
    const z=Math.sqrt(Math.max(0,4-r*r));
    return V3m(r*Math.cos(th)*S, r*Math.sin(th)*S, z*S);
  },80,40);
  addSurf(grp, sphereTop, 0xf5a05d, 0.65);
  const cylWall=paramGeo((u,v)=>{
    const th=(u-0.5)*Math.PI, r=2*Math.cos(th);
    const zMax=Math.sqrt(Math.max(0,4-r*r));
    return V3m(r*Math.cos(th)*S, r*Math.sin(th)*S, v*zMax*S);
  },80,30);
  addSurf(grp, cylWall, 0x6b95ff, 0.3);
  const bot=paramGeo((u,v)=>{
    const th=u*Math.PI*2, r=v;
    return V3m((1+r*Math.cos(th))*S, r*Math.sin(th)*S, 0);
  },72,30);
  addSurf(grp, bot, 0x5df5b0, 0.4);
}

// #6: Cilindro r=4, sobre XY, bajo plano 2z=y (z=y/2)
// θ∈[0,π], r∈[0,4], z∈[0, r·sinθ/2]
function buildSolid6(grp) {
  const S=0.28;
  // Top surface: z = r·sinθ/2 (inclined plane in cylindrical form)
  const topSurf=paramGeo((u,v)=>{
    const th=u*Math.PI, r=v*4;
    const z=r*Math.sin(th)/2;
    return V3m(r*Math.cos(th)*S, r*Math.sin(th)*S, z*S);
  },80,40);
  addSurf(grp, topSurf, 0xf5a05d, 0.65);
  // Bottom disk z=0, semicircle y≥0
  const bot=paramGeo((u,v)=>{
    const th=u*Math.PI, r=v*4;
    return V3m(r*Math.cos(th)*S, r*Math.sin(th)*S, 0);
  },80,30);
  addSurf(grp, bot, 0x6b95ff, 0.35);
  // Cylinder wall r=4, θ∈[0,π], z from 0 to 2sinθ
  const cylWall=paramGeo((u,v)=>{
    const th=u*Math.PI, r=4;
    const zMax=r*Math.sin(th)/2;
    return V3m(r*Math.cos(th)*S, r*Math.sin(th)*S, v*zMax*S);
  },80,20);
  addSurf(grp, cylWall, 0x5df5b0, 0.3);
  // Flat walls at θ=0 (xz plane) and θ=π
  const wall0=paramGeo((u,v)=>V3m(-u*4*S, 0, 0),20,1);
  addSurf(grp, wall0, 0x9ab5ff, 0.25);
}

// #7: Entre paraboloide z=x²+y² y cilindro parabólico z=5-y²
function buildSolid7(grp) {
  const S=0.45;
  // Bottom: paraboloid z=x²+y²
  // Region: x²+2y²≤5 (ellipse)
  const parb=paramGeo((u,v)=>{
    const th=u*Math.PI*2;
    // ellipse: x=√5·cos, y=√(5/2)·sin, scaled by v
    const a=Math.sqrt(5), b=Math.sqrt(2.5);
    const x=v*a*Math.cos(th), y=v*b*Math.sin(th);
    const z=x*x+y*y;
    return V3m(x*S, y*S, z*S);
  },80,40);
  addSurf(grp, parb, 0xf5a05d, 0.65);
  // Top: cylindrical paraboloid z=5-y²
  const topSurf=paramGeo((u,v)=>{
    const th=u*Math.PI*2;
    const a=Math.sqrt(5), b=Math.sqrt(2.5);
    const x=v*a*Math.cos(th), y=v*b*Math.sin(th);
    const z=5-y*y;
    return V3m(x*S, y*S, Math.max(z,0)*S);
  },80,40);
  addSurf(grp, topSurf, 0x6b95ff, 0.45);
  // Side walls (vertical extent at ellipse boundary)
  const side=paramGeo((u,v)=>{
    const th=u*Math.PI*2;
    const a=Math.sqrt(5), b=Math.sqrt(2.5);
    const x=a*Math.cos(th), y=b*Math.sin(th);
    const zBot=x*x+y*y, zTop=5-y*y;
    const z=zBot+(zTop-zBot)*v;
    return V3m(x*S, y*S, Math.max(z,0)*S);
  },80,1);
  addSurf(grp, side, 0x5df5b0, 0.25);
  // Volume fill
  for(let fi=0.25;fi<=0.85;fi+=0.3){
    const fill=paramGeo((u,v)=>{
      const th=u*Math.PI*2;
      const a=Math.sqrt(5), b=Math.sqrt(2.5);
      const x=v*a*Math.cos(th), y=v*b*Math.sin(th);
      const zBot=x*x+y*y, zTop=5-y*y;
      return V3m(x*S, y*S, (zBot+(zTop-zBot)*fi)*S);
    },80,40);
    addSurf(grp, fill, 0x9ab5ff, 0.08);
  }
}

// #8: Interior esfera x²+y²+z²=5, superior al cono z=r/2 (x²+y²=4z²)
// Cilíndricas: θ∈[0,2π], r∈[0,2], z∈[r/2, √(5-r²)]
function buildSolid8(grp) {
  const S=0.7;
  // Sphere cap (top surface)
  const sph=paramGeo((u,v)=>{
    const th=u*Math.PI*2, r=v*2;
    const z=Math.sqrt(Math.max(0,5-r*r));
    return V3m(r*Math.cos(th)*S, r*Math.sin(th)*S, z*S);
  },80,40);
  addSurf(grp, sph, 0xf5a05d, 0.55);
  // Cone bottom (z=r/2)
  const cone=paramGeo((u,v)=>{
    const th=u*Math.PI*2, r=v*2;
    return V3m(r*Math.cos(th)*S, r*Math.sin(th)*S, (r/2)*S);
  },80,40);
  addSurf(grp, cone, 0x5df5b0, 0.6);
  // Side wall at r=2 from z=1 to z=1 (just a ring at intersection)
  const ring=paramGeo((u,v)=>{
    const th=u*Math.PI*2, r=2;
    const zBot=r/2, zTop=Math.sqrt(Math.max(0,5-r*r));
    return V3m(r*Math.cos(th)*S, r*Math.sin(th)*S, (zBot+(zTop-zBot)*v)*S);
  },80,10);
  addSurf(grp, ring, 0x6b95ff, 0.3);
  // Volume fill
  for(let fi=0.3;fi<=0.8;fi+=0.25){
    const fill=paramGeo((u,v)=>{
      const th=u*Math.PI*2, r=v*2;
      const zBot=r/2, zTop=Math.sqrt(Math.max(0,5-r*r));
      return V3m(r*Math.cos(th)*S, r*Math.sin(th)*S, (zBot+(zTop-zBot)*fi)*S);
    },80,40);
    addSurf(grp, fill, 0xffcc66, 0.09);
  }
}

// #9: Interior esfera ρ=4, interior cono φ≤π/4 (z≥√(x²+y²))
// Esféricas: θ∈[0,2π], φ∈[0,π/4], ρ∈[0,4]
function buildSolid9(grp) {
  const S=0.35;
  // Spherical cap (outer surface)
  const sph=paramGeo((u,v)=>{
    const th=u*Math.PI*2, ph=v*Math.PI/4, rho=4*S;
    return V3m(rho*Math.sin(ph)*Math.cos(th), rho*Math.sin(ph)*Math.sin(th), rho*Math.cos(ph));
  },80,36);
  addSurf(grp, sph, 0xf5a05d, 0.5);
  // Cone base (bottom, φ=π/4)
  const coneBase=paramGeo((u,v)=>{
    const th=u*Math.PI*2, ph=Math.PI/4, rho=v*4*S;
    return V3m(rho*Math.sin(ph)*Math.cos(th), rho*Math.sin(ph)*Math.sin(th), rho*Math.cos(ph));
  },80,30);
  addSurf(grp, coneBase, 0x5df5b0, 0.55);
  // Volume fill
  for(let ri=0.25;ri<=0.85;ri+=0.2){
    const fill=paramGeo((u,v)=>{
      const th=u*Math.PI*2, ph=v*Math.PI/4, rho=ri*4*S;
      return V3m(rho*Math.sin(ph)*Math.cos(th), rho*Math.sin(ph)*Math.sin(th), rho*Math.cos(ph));
    },80,36);
    addSurf(grp, fill, 0x9ab5ff, 0.09);
  }
  // z axis cap (top point area)
  const top=paramGeo((u,v)=>V3m(0, 0, v*4*S*(1-u*0)),1,30);
  // just show the z axis inside as a visual guide (skip, axis already there)
}

function select(idx) {
  document.querySelectorAll('.s-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
  const s=SOLIDS[idx];
  clearSolid();
  s.build(solidGrp);
  theta=s.cam.th; phi=s.cam.ph; radius=s.cam.r; panX=0; panY=s.cam.py;
  camUpdate();
  document.getElementById('overlayName').textContent=s.fullTitle;
  const ib=document.getElementById('integralBox');
  ib.innerHTML=`\\(${s.integral}\\)`;
  if(window.MathJax) MathJax.typesetPromise([ib]).catch(()=>{});
  document.getElementById('descWrap').innerHTML=`
    <div class="info-label l2">Descripción</div>
    <div class="desc-title">${s.fullTitle}</div>
    <p style="font-size:0.78rem;color:var(--text2);margin-bottom:10px;line-height:1.5">${s.desc}</p>
    <div class="tags">${s.constraints.map(c=>`<span class="tag-item">${c}</span>`).join('')}</div>
  `;
}
